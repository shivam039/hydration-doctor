name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'shivam039/hydration-doctor'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.15.0

      - name: Verify release tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          if [[ "$(npm --version)" != 11.15.0 ]]; then
            echo "Expected npm 11.15.0 for reproducible trusted publishing; found $(npm --version)" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run release checks
        run: |
          npm run check
          npm run test:consumer
          npm pack --dry-run

      - name: Verify registry version matches this release artifact
        id: registry
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/packed.json"
          PACKAGE_INTEGRITY="$(node -e "console.log(JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8'))[0].integrity)" "$RUNNER_TEMP/packed.json")"
          if REGISTRY_INTEGRITY="$(npm view "hydration-doctor@$PACKAGE_VERSION" dist.integrity --json 2>/dev/null)"; then
            REGISTRY_INTEGRITY="${REGISTRY_INTEGRITY//\"/}"
            if [[ "$REGISTRY_INTEGRITY" != "$PACKAGE_INTEGRITY" ]]; then
              echo "Registry version $PACKAGE_VERSION exists with different package integrity" >&2
              exit 1
            fi
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.already-published != 'true'
        run: npm publish --access public

      - name: Confirm this exact artifact is already published
        if: steps.registry.outputs.already-published == 'true'
        run: echo "The registry already contains this exact package artifact; skipping duplicate publication."
